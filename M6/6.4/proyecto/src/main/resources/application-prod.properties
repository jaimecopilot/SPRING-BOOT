spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mibd}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.root=INFO
logging.file.name=${LOG_FILE:logs/mi-proyecto.log}
app.nombre-oficina=${APP_NOMBRE_OFICINA:Oficina de Produccion}
app.version=${APP_VERSION:5.0.0}
app.entorno=prod
curso.entorno=prod
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://sede.educacion.gob.es}
