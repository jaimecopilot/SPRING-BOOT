name: Validar M4

on:
  push:
    branches: [ main ]
    paths:
      - 'M4/**'
      - '.course/source-audit/M4.md'
      - '.course/traceability/M4/**'
      - '.course/traceability/M4.json'
      - '.course/traceability/TRAZABILIDAD_M4.md'
      - '.course/traceability/validate_m4_core.py'
      - '.course/traceability/validate_m4.py'
      - '.course/traceability/validate_m4_human.py'
      - '.course/traceability/validate_m4_mutation.py'
      - '.course/traceability/validate_m4_runtime.py'
      - '.github/workflows/validar-m4.yml'

jobs:
  validar-m4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validar contrato fuerte M4 R1
        run: python .course/traceability/validate_m4.py .

      - name: Verificar trazabilidad humana reversible
        run: python .course/traceability/validate_m4_human.py .

      - name: Mutation gate de trazabilidad
        run: python .course/traceability/validate_m4_mutation.py .

      - name: Recuperar permiso Unix del Maven Wrapper
        run: chmod +x M4/proyecto/mvnw

      - name: Verificar Maven Wrapper 3.9.16
        working-directory: M4/proyecto
        run: ./mvnw --version | grep 'Apache Maven 3.9.16'

      - name: Ejecutar tests y calidad
        working-directory: M4/proyecto
        run: ./mvnw -B clean verify

      - name: Generar Javadoc
        working-directory: M4/proyecto
        run: ./mvnw -B javadoc:javadoc

      - name: Empaquetar JAR ejecutable
        working-directory: M4/proyecto
        run: ./mvnw -B -DskipTests package

      - name: Validar runtime acumulativo y OpenAPI
        run: python .course/traceability/validate_m4_runtime.py .
