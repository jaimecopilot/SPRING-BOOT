name: Ensamblar M1.4

on:
  push:
    branches: [m1-edicion-fuerte]
    paths:
      - '.course/tmp/M1_14_TEORIA_APPEND.md'
      - '.course/tmp/M1_14_PRACTICA_APPEND.md'
      - '.github/workflows/assemble-m1-14.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: m1-edicion-fuerte
          fetch-depth: 0

      - name: Integrar 1.4 y limpiar ensamblador
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^# Punto 1.4 - Diseño de APIs REST$' M1/TEORIA.md; then
            cat .course/tmp/M1_14_TEORIA_APPEND.md >> M1/TEORIA.md
          fi
          if ! grep -q '^# Práctica 1.4 - Diseño de APIs REST$' M1/PRACTICA.md; then
            cat .course/tmp/M1_14_PRACTICA_APPEND.md >> M1/PRACTICA.md
          fi
          rm -f .course/tmp/M1_14_TEORIA_APPEND.md .course/tmp/M1_14_PRACTICA_APPEND.md
          rm -f .github/workflows/assemble-m1-14.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(m1): integra teoría y práctica 1.4'
          git push origin HEAD:m1-edicion-fuerte
