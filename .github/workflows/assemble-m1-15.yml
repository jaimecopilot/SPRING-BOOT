name: Ensamblar M1.5

on:
  push:
    branches: [m1-edicion-fuerte]
    paths:
      - '.course/tmp/M1_15_TEORIA_APPEND.md'
      - '.course/tmp/M1_15_PRACTICA_APPEND.md'
      - '.github/workflows/assemble-m1-15.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: m1-edicion-fuerte
          fetch-depth: 0

      - name: Integrar 1.5 y limpiar ensamblador
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ['.course/tmp/M1_15_TEORIA_APPEND.md', '.course/tmp/M1_15_PRACTICA_APPEND.md']:
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              # Los filecite pertenecen a la conversación de auditoría, nunca al material del alumno.
              text=re.sub(r'\s*filecite[^]+', '', text)
              p.write_text(text, encoding='utf-8')
          PY
          if ! grep -q '^# Punto 1.5 - Primer CRUD con DTOs$' M1/TEORIA.md; then
            cat .course/tmp/M1_15_TEORIA_APPEND.md >> M1/TEORIA.md
          fi
          if ! grep -q '^# Práctica 1.5 - Primer CRUD con DTOs$' M1/PRACTICA.md; then
            cat .course/tmp/M1_15_PRACTICA_APPEND.md >> M1/PRACTICA.md
          fi
          rm -f .course/tmp/M1_15_TEORIA_APPEND.md .course/tmp/M1_15_PRACTICA_APPEND.md
          rm -f .github/workflows/assemble-m1-15.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(m1): integra teoría y práctica 1.5'
          git push origin HEAD:m1-edicion-fuerte
