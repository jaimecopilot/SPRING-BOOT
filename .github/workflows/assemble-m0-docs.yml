name: Ensamblar documentación M0

on:
  push:
    branches: [m0-draft]
    paths:
      - '.course/staging/M0/**'
      - '.course/assemble_m0.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: m0-draft
          fetch-depth: 0

      - name: Ensamblar Markdown exacto
        run: bash .course/assemble_m0.sh

      - name: Validar contenido didáctico visible
        shell: bash
        run: |
          grep -q 'Recorrido A - Ciclo diario exclusivamente desde consola' M0/PRACTICA.md
          grep -q 'Recorrido B - Ciclo diario completo en IntelliJ IDEA' M0/PRACTICA.md
          grep -q 'Recorrido C - Ciclo diario completo en Eclipse' M0/PRACTICA.md
          grep -q 'Recorrido D - Ciclo diario completo en VS Code' M0/PRACTICA.md
          grep -q '### Pregunta' M0/TEORIA.md
          grep -q '### Respuesta razonada' M0/TEORIA.md
          grep -q '### Pregunta' M0/PRACTICA.md
          grep -q '### Respuesta razonada' M0/PRACTICA.md
          ! grep -Eqi 'Fidelidad didáctica|GUIDE/INHERITED/SUPPORT|\.course/traceability|checkpoint' M0/TEORIA.md M0/PRACTICA.md

      - name: Publicar Markdown ensamblado en el branch
        shell: bash
        run: |
          git add M0/TEORIA.md M0/PRACTICA.md
          if git diff --cached --quiet; then
            echo 'Documentación ya sincronizada.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(m0): publica teoría y práctica completas'
          git push origin HEAD:m0-draft
