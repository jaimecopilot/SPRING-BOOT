name: M6 coherence hotfix

on:
  push:
    branches:
      - main
    paths:
      - .course/internal/M6_COHERENCE_HOTFIX.trigger

permissions:
  contents: write

jobs:
  fix-m6:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Apply and validate targeted corrections
        run: python3 .course/internal/m6_coherence_hotfix.py

      - name: Verify snapshot 6.4 tests
        run: |
          cd M6/6.4/proyecto
          chmod +x mvnw
          ./mvnw -B test

      - name: Verify final snapshot 6.9 tests
        run: |
          cd M6/6.9/proyecto
          chmod +x mvnw
          ./mvnw -B test

      - name: Install canonical PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra fonts-dejavu-core poppler-utils

      - name: Regenerate canonical M6 practice PDF
        run: |
          pandoc M6/PRACTICA.md \
            -o M6/M6_PRACTICA.pdf \
            --pdf-engine=xelatex \
            --toc \
            -V geometry:margin=0.7in \
            -V fontsize=10pt \
            -V mainfont="DejaVu Serif" \
            -V monofont="DejaVu Sans Mono" \
            -H .course/pdf/course_header.tex
          pdfinfo M6/M6_PRACTICA.pdf | grep '^Pages:'
          pdftotext M6/M6_PRACTICA.pdf /tmp/m6_practica.txt
          grep -F 'TOKEN_INVALIDO' /tmp/m6_practica.txt >/dev/null
          grep -F 'GESTOR se probará de forma persistente a partir de 6.8' /tmp/m6_practica.txt >/dev/null

      - name: Update traceability PDF page count
        run: |
          PAGES=$(pdfinfo M6/M6_PRACTICA.pdf | awk '/^Pages:/ {print $2}')
          python3 .course/internal/m6_coherence_hotfix.py --pages "$PAGES"

      - name: Commit corrected canonical artifacts
        run: |
          git config user.name "jaimecopilot"
          git config user.email "jaimegithub@outlook.com"
          git add M6/PRACTICA.md M6/M6_PRACTICA.pdf M6/TRAZABILIDAD.md
          git diff --cached --check
          git commit -m "M6: corrige coherencia ejecutable en 6.4 y 6.8"
          git push origin main

      - name: Upload corrected PDF for visual verification
        uses: actions/upload-artifact@v4
        with:
          name: M6-PRACTICA-coherence-hotfix
          path: M6/M6_PRACTICA.pdf
          if-no-files-found: error
