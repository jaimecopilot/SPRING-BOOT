name: Validar M5

on:
  push:
    branches: [ main ]
    paths:
      - 'M5/**'
      - '.course/source-audit/M5.md'
      - '.course/traceability/M5/**'
      - '.course/traceability/M5.json'
      - '.course/traceability/TRAZABILIDAD_M5.md'
      - '.course/traceability/validate_m5_core.py'
      - '.course/traceability/validate_m5.py'
      - '.course/traceability/validate_m5_human.py'
      - '.course/traceability/validate_m5_mutation.py'
      - '.course/traceability/validate_m5_runtime.py'
      - '.github/workflows/validar-m5.yml'

jobs:
  validar-m5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validar contrato fuerte M5
        run: python .course/traceability/validate_m5.py .

      - name: Verificar trazabilidad humana reversible
        run: python .course/traceability/validate_m5_human.py .

      - name: Mutation gate de trazabilidad
        run: python .course/traceability/validate_m5_mutation.py .

      - name: Recuperar permiso Unix del Maven Wrapper
        run: chmod +x M5/proyecto/mvnw

      - name: Verificar Maven Wrapper 3.9.16
        working-directory: M5/proyecto
        run: ./mvnw --version | grep 'Apache Maven 3.9.16'

      - name: Ejecutar tests y calidad
        working-directory: M5/proyecto
        run: ./mvnw -B clean verify

      - name: Generar Javadoc
        working-directory: M5/proyecto
        run: ./mvnw -B javadoc:javadoc

      - name: Empaquetar JAR ejecutable
        working-directory: M5/proyecto
        run: ./mvnw -B -DskipTests package

      - name: Validar runtime, errores, CORS y OpenAPI
        run: python .course/traceability/validate_m5_runtime.py .
