name: Integrar M2 staging

on:
  push:
    branches: [m2-integration-staging]
    paths:
      - '.course/tmp/m2_bundle_ready'

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: m2-integration-staging
          fetch-depth: 0

      - name: Integrar paquete M2 completo
        shell: bash
        run: |
          set -euo pipefail
          READY='.course/tmp/m2_bundle_ready'
          if [[ ! -f "$READY" ]]; then
            echo 'Marcador de integración no disponible.'
            exit 1
          fi

          mkdir -p /tmp/m2bundle/unpacked
          cat .course/tmp/m2_bundle_part_* > /tmp/m2bundle/m2.b64
          base64 -d /tmp/m2bundle/m2.b64 > /tmp/m2bundle/m2.tar.xz
          tar -xJf /tmp/m2bundle/m2.tar.xz -C /tmp/m2bundle/unpacked

          rm -rf M2
          cp -a /tmp/m2bundle/unpacked/M2 ./M2
          mkdir -p .course/traceability/M2 .course/source-audit
          rm -rf .course/traceability/M2
          mkdir -p .course/traceability/M2
          cp -a /tmp/m2bundle/unpacked/.course/traceability/M2.json .course/traceability/M2.json
          cp -a /tmp/m2bundle/unpacked/.course/traceability/M2/. .course/traceability/M2/
          cp -a /tmp/m2bundle/unpacked/.course/traceability/TRAZABILIDAD_M2.md .course/traceability/TRAZABILIDAD_M2.md
          cp -a /tmp/m2bundle/unpacked/.course/traceability/validate_m2.py .course/traceability/validate_m2.py
          cp -a /tmp/m2bundle/unpacked/.course/source-audit/M2.md .course/source-audit/M2.md
          cp -a /tmp/m2bundle/unpacked/.github/workflows/validar-m2.yml .github/workflows/validar-m2.yml

          rm -f .course/tmp/M2_23_TEORIA_APPEND.md
          rm -f .course/tmp/m2_bundle_part_*
          rm -f "$READY"
          rm -f .github/workflows/integrate-m2-staging.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'M2: integrar módulo completo 2.1-2.6 y proyecto final'
          git push origin HEAD:m2-integration-staging
