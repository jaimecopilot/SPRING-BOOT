name: Corregir pregunta M1.2

on:
  push:
    branches: [m1-edicion-fuerte]
    paths:
      - '.github/workflows/fix-m1-1-2-question.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: m1-edicion-fuerte
      - name: Emparejar pregunta y respuesta y retirar workflow temporal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('M1/PRACTICA.md')
          s = p.read_text(encoding='utf-8')
          old = '''Ahora responde:\n\n1. ¿Qué cambia entre 404 y 405?'''
          new = '''### Pregunta\n\n1. ¿Qué cambia entre 404 y 405?'''
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one editorial target, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-m1-1-2-question.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add M1/PRACTICA.md
          git commit -m 'docs(m1): empareja pregunta y respuesta de 1.2.9'
          git push origin HEAD:m1-edicion-fuerte
