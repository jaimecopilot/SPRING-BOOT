name: Generar trazabilidad humana M2

on:
  pull_request:
    paths:
      - '.github/workflows/generate-m2-traceability-report.yml'

permissions:
  contents: write

jobs:
  generar:
    if: github.head_ref == 'm2-edicion-fuerte'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: m2-edicion-fuerte
      - name: Generar informe y retirar este workflow temporal
        shell: bash
        run: |
          set -euo pipefail
          python .course/traceability/generate_module_traceability.py M2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .course/traceability/TRAZABILIDAD_M2.md
          git rm .github/workflows/generate-m2-traceability-report.yml
          git commit -m 'docs(m2): genera trazabilidad humana del punto 2.1'
          git push origin HEAD:m2-edicion-fuerte
