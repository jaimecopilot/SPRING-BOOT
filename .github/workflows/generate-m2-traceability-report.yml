name: Generar trazabilidad humana M2

on:
  push:
    branches: [m2-edicion-fuerte]
    paths:
      - '.github/workflows/generate-m2-traceability-report.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: m2-edicion-fuerte
          fetch-depth: 0
      - name: Regenerar informe y eliminar workflow temporal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin m2-edicion-fuerte
          python .course/traceability/generate_module_traceability.py M2
          python .course/traceability/generate_module_traceability.py M2 --check
          git add .course/traceability/TRAZABILIDAD_M2.md
          git rm .github/workflows/generate-m2-traceability-report.yml
          git commit -m 'M2.2: sincronizar trazabilidad humana'
          git push origin HEAD:m2-edicion-fuerte
