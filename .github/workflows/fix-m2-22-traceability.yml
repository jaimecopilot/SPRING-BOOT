name: Ajustar trazabilidad acumulativa M2 2.1 a 2.2

on:
  push:
    branches: [m2-edicion-fuerte]
    paths:
      - '.github/workflows/fix-m2-22-traceability.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: m2-edicion-fuerte
          fetch-depth: 0
      - name: Ajustar evolución histórica, auditoría y guía; regenerar informe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin m2-edicion-fuerte
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          p = Path('.course/traceability/M2/2.1.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          by_id = {s['id']: s for s in data['steps']}

          def set_symbols(step_id, symbols, verification):
              step = by_id[step_id]
              assert len(step['artifacts']) == 1, (step_id, step['artifacts'])
              step['artifacts'][0]['symbols'] = symbols
              step['verification'] = [verification]

          set_symbols(
              'M2-P-21-S02',
              ['@PostMapping', 'ResponseEntity.created(location).body(creado)'],
              '2.1 identificó generación de ID y almacenamiento como lógica no HTTP; 2.2 mueve esa implementación a AlumnoService y el controlador final conserva la construcción de la respuesta.'
          )
          set_symbols(
              'M2-P-21-S03',
              ['import java.net.URI', 'URI location = URI.create(', 'ResponseEntity.created(location).body(creado)'],
              'El 201 + Location introducido en 2.1 permanece; el helper guardarAlumno y la generación de ID evolucionan en 2.2 hacia AlumnoService.'
          )
          set_symbols(
              'M2-P-21-S05',
              ['@RequestParam(required = false) String curso', '@RequestParam(required = false) String sort', '@RequestParam(defaultValue = "0") int page', '@RequestParam(defaultValue = "20") int size', 'return service.listar(curso, sort, page, size)'],
              'Los cuatro parámetros HTTP permanecen en el controlador; 2.2 mueve skip/limit y la lógica de consulta al servicio sin cambiar el contrato externo.'
          )
          set_symbols(
              'M2-P-21-S06',
              ['@PostMapping("/promocionar")', 'public ResponseEntity<Void> promocionar', 'service.promocionar()', 'ResponseEntity.noContent().build()'],
              'El endpoint y su 204 permanecen; 2.2 traslada la mutación de cursos a AlumnoService.'
          )
          set_symbols(
              'M2-P-21-S07',
              ['service.consultar(id)', 'service.actualizar(id, dto)'],
              '2.1 hizo explícita la reutilización de la búsqueda; 2.2 completa la evolución trasladando esa responsabilidad al servicio y los endpoints conservan 200/404.'
          )
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          practice = Path('M2/PRACTICA.md')
          text = practice.read_text(encoding='utf-8')
          count = len(re.findall(r'(?i)\bcheckpoint\b', text))
          assert count > 0, 'Se esperaba al menos una aparición de checkpoint en PRACTICA.md'
          text = re.sub(r'(?i)\bcheckpoint\b', 'estado de 2.1', text)
          assert not re.search(r'(?i)\bcheckpoint\b', text)
          practice.write_text(text, encoding='utf-8')

          audit = Path('.course/source-audit/M2.md')
          text = audit.read_text(encoding='utf-8')
          replacements = {
              'M2-T-22-DTO-MODEL': 'M2-T-22-DTO-ENTITY',
              'M2-T-22-BUSINESS-ERRORS': 'M2-T-22-BUSINESS-EXCEPTIONS',
          }
          for old, new in replacements.items():
              assert old in text, f'No se encontró {old} en source audit'
              text = text.replace(old, new)
          audit.write_text(text, encoding='utf-8')
          PY

          python .course/traceability/generate_module_traceability.py M2
          python .course/traceability/generate_module_traceability.py M2 --check

          git add M2/PRACTICA.md .course/source-audit/M2.md .course/traceability/M2/2.1.json .course/traceability/TRAZABILIDAD_M2.md
          git rm .github/workflows/fix-m2-22-traceability.yml
          git commit -m 'M2.2: reconciliar evolución de trazabilidad 2.1 a servicio'
          git push origin HEAD:m2-edicion-fuerte
