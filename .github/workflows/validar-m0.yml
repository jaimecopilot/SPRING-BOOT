name: Validar M0

on:
  push:
    branches: [main, m0-trazabilidad-fuerte]
    paths:
      - 'M0/**'
      - '.course/traceability/**'
      - '.course/source-audit/**'
      - '.github/workflows/validar-m0.yml'
  pull_request:
    paths:
      - 'M0/**'
      - '.course/traceability/**'
      - '.course/source-audit/**'
      - '.github/workflows/validar-m0.yml'

jobs:
  validar-m0:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Comprobar vista humana de trazabilidad
        run: python .course/traceability/generate_human_traceability.py --check

      - name: Validar trazabilidad fuerte teoría-paso-código
        run: python .course/traceability/validate_m0.py .

      - name: Verificar ejemplo Java previo a Spring
        shell: bash
        run: |
          set -euo pipefail
          javac --release 17 M0/ejemplos/HolaMinisterio.java
          test "$(java -Dfile.encoding=UTF-8 -cp M0/ejemplos HolaMinisterio)" = "Hola, Ministerio de Educación"
          test "$(java -Dfile.encoding=UTF-8 -cp M0/ejemplos HolaMinisterio Ana)" = "Hola, Ana, bienvenido al Ministerio de Educación"
          rm -f M0/ejemplos/HolaMinisterio.class

      - name: Verificar Maven Wrapper enseñado en la guía
        working-directory: M0/proyecto
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mvnw
          ./mvnw -version
          ./mvnw -version | grep -q 'Apache Maven 3.9.16'

      - name: Ejecutar tests con Maven Wrapper
        working-directory: M0/proyecto
        run: ./mvnw -B test

      - name: Empaquetar JAR con Maven Wrapper
        working-directory: M0/proyecto
        run: ./mvnw -B -DskipTests package

      - name: Arrancar JAR y probar HTTP real
        working-directory: M0/proyecto
        shell: bash
        run: |
          set -euo pipefail
          java -jar target/mi-proyecto-0.0.1-SNAPSHOT.jar > /tmp/m0.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..45}; do
            if curl --fail --silent http://localhost:8080/hola > /tmp/hola.txt; then
              break
            fi
            sleep 1
          done
          test "$(cat /tmp/hola.txt)" = "Hola, Ministerio de Educación"
          test "$(curl --fail --silent http://localhost:8080/adios)" = "Adiós, Ministerio de Educación"
          grep -q 'Started MiProyectoApplication' /tmp/m0.log
