name: Validar M0

on:
  push:
    branches: [m0-draft, main]
    paths:
      - 'M0/**'
      - '.github/workflows/validar-m0.yml'
  pull_request:
    paths:
      - 'M0/**'
      - '.github/workflows/validar-m0.yml'

jobs:
  validar-m0:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: M0/proyecto
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Mostrar versiones
        run: |
          java -version
          mvn -version

      - name: Ejecutar tests
        run: mvn -B test

      - name: Empaquetar JAR
        run: mvn -B -DskipTests package

      - name: Arrancar aplicación y probar HTTP real
        shell: bash
        run: |
          set -euo pipefail
          java -jar target/mi-proyecto-0.0.1-SNAPSHOT.jar > /tmp/m0.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..45}; do
            if curl --fail --silent http://localhost:8080/hola > /tmp/hola.txt; then
              break
            fi
            sleep 1
          done
          test "$(cat /tmp/hola.txt)" = "Hola, Ministerio de Educación"
          test "$(curl --fail --silent http://localhost:8080/adios)" = "Adiós, Ministerio de Educación"
          grep -q 'Started MiProyectoApplication' /tmp/m0.log
