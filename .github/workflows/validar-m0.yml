name: Validar M0

on:
  push:
    branches: [main, m0-trazabilidad-fuerte, m0-auditoria-limpieza]
    paths:
      - 'M0/**'
      - '.course/traceability/**'
      - '.course/source-audit/**'
      - '.course/internal/**'
      - '.github/workflows/validar-m0.yml'
  pull_request:
    paths:
      - 'M0/**'
      - '.course/traceability/**'
      - '.course/source-audit/**'
      - '.course/internal/**'
      - '.github/workflows/validar-m0.yml'

permissions:
  contents: write

jobs:
  validar-m0:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Regenerar vista humana en rama de auditoría
        if: (github.event_name == 'push' && github.ref == 'refs/heads/m0-auditoria-limpieza') || (github.event_name == 'pull_request' && github.head_ref == 'm0-auditoria-limpieza')
        shell: bash
        run: |
          set -euo pipefail
          python .course/traceability/generate_human_traceability.py
          if ! git diff --quiet -- .course/traceability/TRAZABILIDAD_M0.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .course/traceability/TRAZABILIDAD_M0.md
            git commit -m 'trace(m0): regenera informe humano tras auditoría'
            git push origin HEAD:m0-auditoria-limpieza
          fi

      - name: Comprobar vista humana de trazabilidad
        run: python .course/traceability/generate_human_traceability.py --check

      - name: Validar trazabilidad fuerte teoría-paso-código
        run: python .course/traceability/validate_m0.py .

      - name: Verificar ejemplo Java previo a Spring
        shell: bash
        run: |
          set -euo pipefail
          javac --release 17 M0/ejemplos/HolaMinisterio.java
          test "$(java -Dfile.encoding=UTF-8 -cp M0/ejemplos HolaMinisterio)" = "Hola, Ministerio de Educación"
          test "$(java -Dfile.encoding=UTF-8 -cp M0/ejemplos HolaMinisterio Ana)" = "Hola, Ana, bienvenido al Ministerio de Educación"
          rm -f M0/ejemplos/HolaMinisterio.class

      - name: Verificar Maven Wrapper enseñado en la guía
        working-directory: M0/proyecto
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mvnw
          ./mvnw -version
          ./mvnw -version | grep -q 'Apache Maven 3.9.16'

      - name: Validar comandos Maven de inspección enseñados
        working-directory: M0/proyecto
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B dependency:tree > /tmp/dependency-tree.txt
          grep -q 'spring-boot-starter-web' /tmp/dependency-tree.txt
          ./mvnw -B help:effective-pom -Doutput=target/effective-pom.xml
          test -s target/effective-pom.xml
          grep -q 'spring-boot-starter-web' target/effective-pom.xml
          ./mvnw -B spring-boot:help -Ddetail=true -Dgoal=run > /tmp/spring-boot-run-help.txt
          grep -q 'spring-boot:run' /tmp/spring-boot-run-help.txt

      - name: Ejecutar tests con Maven Wrapper
        working-directory: M0/proyecto
        run: ./mvnw -B test

      - name: Empaquetar JAR con Maven Wrapper
        working-directory: M0/proyecto
        run: ./mvnw -B -DskipTests package

      - name: Arrancar JAR y probar HTTP real
        working-directory: M0/proyecto
        shell: bash
        run: |
          set -euo pipefail
          PID=''
          PID2=''
          cleanup() {
            if [[ -n "$PID" ]]; then kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; fi
            if [[ -n "$PID2" ]]; then kill "$PID2" 2>/dev/null || true; wait "$PID2" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          java -jar target/mi-proyecto-0.0.1-SNAPSHOT.jar > /tmp/m0.log 2>&1 &
          PID=$!
          for i in {1..45}; do
            if curl --fail --silent http://localhost:8080/hola > /tmp/hola.txt; then
              break
            fi
            sleep 1
          done
          test "$(cat /tmp/hola.txt)" = "Hola, Ministerio de Educación"
          test "$(curl --fail --silent http://localhost:8080/adios)" = "Adiós, Ministerio de Educación"
          test "$(curl --silent --output /tmp/no-existe.txt --write-out '%{http_code}' http://localhost:8080/no-existe)" = "404"
          grep -q 'Started MiProyectoApplication' /tmp/m0.log

          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          PID=''

          java -jar target/mi-proyecto-0.0.1-SNAPSHOT.jar --server.port=8081 > /tmp/m0-8081.log 2>&1 &
          PID2=$!
          for i in {1..45}; do
            if curl --fail --silent http://localhost:8081/hola > /tmp/hola-8081.txt; then
              break
            fi
            sleep 1
          done
          test "$(cat /tmp/hola-8081.txt)" = "Hola, Ministerio de Educación"
          grep -q 'Started MiProyectoApplication' /tmp/m0-8081.log
