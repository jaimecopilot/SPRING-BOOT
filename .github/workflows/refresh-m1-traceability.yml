name: Refrescar trazabilidad humana M1

on:
  push:
    branches: [m1-edicion-fuerte]
    paths:
      - '.github/workflows/refresh-m1-traceability.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: m1-edicion-fuerte
      - name: Regenerar informe humano M1 y retirar workflow temporal
        shell: bash
        run: |
          set -euo pipefail
          python .course/traceability/generate_module_traceability.py M1
          rm .github/workflows/refresh-m1-traceability.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .course/traceability/TRAZABILIDAD_M1.md .github/workflows/refresh-m1-traceability.yml
          git diff --cached --quiet && exit 0
          git commit -m 'docs(m1): sincroniza trazabilidad humana final'
          git push origin HEAD:m1-edicion-fuerte
