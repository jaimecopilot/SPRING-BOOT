name: Validar M2

on:
  push:
    branches: [main]
    paths: ['M2/**', '.course/traceability/M2*', '.course/traceability/TRAZABILIDAD_M2.md', '.course/source-audit/M2.md', '.github/workflows/validar-m2.yml']
  pull_request:
    paths: ['M2/**', '.course/traceability/M2*', '.course/traceability/TRAZABILIDAD_M2.md', '.course/source-audit/M2.md', '.github/workflows/validar-m2.yml']

permissions:
  contents: read

jobs:
  validar-m2:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v5
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validar contrato final M2 69/69
        run: python .course/traceability/validate_m2.py .
      - name: Verificar sincronía de trazabilidad humana
        run: python .course/traceability/generate_module_traceability.py M2 --check
      - name: Verificar Maven Wrapper 3.9.16
        working-directory: M2/proyecto
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw -version | tee /tmp/m2-maven.txt
          grep -q 'Apache Maven 3.9.16' /tmp/m2-maven.txt
      - name: Ejecutar tests y calidad
        working-directory: M2/proyecto
        run: ./mvnw -B clean verify
      - name: Generar Javadoc
        working-directory: M2/proyecto
        run: ./mvnw -B javadoc:javadoc
      - name: Empaquetar JAR ejecutable
        working-directory: M2/proyecto
        run: ./mvnw -B -DskipTests package
      - name: Validar runtime acumulativo y OpenAPI
        working-directory: M2/proyecto
        shell: bash
        run: |
          set -euo pipefail
          PID=''
          cleanup(){ if [[ -n "$PID" ]]; then kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; fi; }
          trap cleanup EXIT
          java -jar target/mi-proyecto-0.0.1-SNAPSHOT.jar >/tmp/m2-final.log 2>&1 & PID=$!
          for i in {1..45}; do curl -fsS http://localhost:8080/hola >/tmp/hola && break || sleep 1; done
          test "$(cat /tmp/hola)" = 'Hola, Ministerio de Educación'
          test "$(curl -fsS http://localhost:8080/adios)" = 'Adiós, Ministerio de Educación'
          curl -fsS http://localhost:8080/api/v1/alumnos >/tmp/alumnos.json
          curl -fsS http://localhost:8080/api/v1/expedientes/ejemplo >/tmp/exp.json
          curl -fsS http://localhost:8080/api/v1/info >/tmp/info.json
          curl -fsS http://localhost:8080/v3/api-docs >/tmp/openapi.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/alumnos.json')); assert len(a)==2 and [x['id'] for x in a]==['1','2'],a
          e=json.load(open('/tmp/exp.json')); assert e['id']=='12345' and e['fechaSolicitud']=='2025-01-15' and 'numeroSeguridadSocial' not in e,e
          i=json.load(open('/tmp/info.json')); assert i['entorno']=='base' and i['nombre']=='Curso Spring Boot 2026',i
          o=json.load(open('/tmp/openapi.json')); paths=o['paths']; assert '/api/v1/alumnos' in paths and '/api/v1/expedientes' in paths and '/api/v1/info' in paths,paths
          PY
