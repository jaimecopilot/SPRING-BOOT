name: Validar M2

on:
  push:
    branches: [main]
    paths:
      - 'M2/**'
      - '.course/traceability/M2*'
      - '.course/traceability/TRAZABILIDAD_M2.md'
      - '.course/traceability/generate_module_traceability.py'
      - '.course/traceability/validate_module.py'
      - '.course/traceability/validate_m2.py'
      - '.course/source-audit/M2.md'
      - '.course/internal/**'
      - '.github/workflows/validar-m2.yml'
  pull_request:
    paths:
      - 'M2/**'
      - '.course/traceability/M2*'
      - '.course/traceability/TRAZABILIDAD_M2.md'
      - '.course/traceability/generate_module_traceability.py'
      - '.course/traceability/validate_module.py'
      - '.course/traceability/validate_m2.py'
      - '.course/source-audit/M2.md'
      - '.course/internal/**'
      - '.github/workflows/validar-m2.yml'

permissions:
  contents: read

jobs:
  validar-m2:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validar contrato estructural y semántico hasta 2.2
        run: python .course/traceability/validate_m2.py .

      - name: Verificar sincronía de trazabilidad humana
        run: python .course/traceability/generate_module_traceability.py M2 --check

      - name: Verificar Maven Wrapper 3.9.16
        working-directory: M2/proyecto
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mvnw
          ./mvnw -version | tee /tmp/m2-maven-version.txt
          grep -q 'Apache Maven 3.9.16' /tmp/m2-maven-version.txt

      - name: Ejecutar tests acumulativos
        working-directory: M2/proyecto
        run: ./mvnw -B test

      - name: Empaquetar JAR ejecutable
        working-directory: M2/proyecto
        run: ./mvnw -B -DskipTests package

      - name: Validar runtime HTTP acumulado hasta M2.2
        working-directory: M2/proyecto
        shell: bash
        run: |
          set -euxo pipefail
          PID=''
          cleanup() {
            if [[ -n "$PID" ]]; then kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          java -jar target/mi-proyecto-0.0.1-SNAPSHOT.jar > /tmp/m2-22.log 2>&1 &
          PID=$!
          CODE=''
          for i in {1..45}; do
            CODE="$(curl --silent --output /tmp/m2-ready.txt --write-out '%{http_code}' http://localhost:8080/hola || true)"
            [[ "$CODE" == "200" ]] && break
            sleep 1
          done

          echo '=== regresión M0 ==='
          test "$CODE" = "200"
          test "$(cat /tmp/m2-ready.txt)" = "Hola, Ministerio de Educación"
          test "$(curl --fail --silent http://localhost:8080/adios)" = "Adiós, Ministerio de Educación"

          echo '=== contrato JSON M1.3 conservado tras ExpedienteService ==='
          test "$(curl -s -o /tmp/m2-exp-ejemplo.json -w '%{http_code}' http://localhost:8080/api/v1/expedientes/ejemplo)" = "200"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/m2-exp-ejemplo.json', encoding='utf-8'))
          assert data['id']=='12345', data
          assert data['titular']=='Ana García López', data
          assert data['fechaSolicitud']=='2025-01-15', data
          assert data['importe']==1500.0, data
          assert data['activo'] is True, data
          assert data['documentos']==['DNI.pdf','Notas.pdf'], data
          assert 'numeroSeguridadSocial' not in data, data
          assert data['solicitante']=={'nombre':'Ana','apellidos':'García López','dni':'12345678A'}, data
          PY
          test "$(curl -s -o /tmp/m2-exp-eco.json -w '%{http_code}' -X POST http://localhost:8080/api/v1/expedientes/eco -H 'Content-Type: application/json' -d '{"id":"77","titular":"Lucía Pérez","fechaSolicitud":"2025-01-20","solicitante":{"nombre":"Lucía","apellidos":"Pérez Ruiz","dni":"22222222D"}}')" = "200"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/m2-exp-eco.json', encoding='utf-8'))
          assert data['id']=='77', data
          assert data['fechaSolicitud']=='2025-01-20', data
          assert data['solicitante']['dni']=='22222222D', data
          PY

          echo '=== alumnos iniciales y frontera HTTP de 2.1 ==='
          test "$(curl -s -o /tmp/m2-alumnos-inicial.json -w '%{http_code}' http://localhost:8080/api/v1/alumnos)" = "200"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/m2-alumnos-inicial.json', encoding='utf-8'))
          assert len(data)==2, data
          assert [x['id'] for x in data]==['1','2'], data
          assert [x['nombre'] for x in data]==['Ana','Luis'], data
          PY
          test "$(curl -s -o /tmp/m2-get1.json -w '%{http_code}' http://localhost:8080/api/v1/alumnos/1)" = "200"
          test "$(curl -s -o /tmp/m2-get999.json -w '%{http_code}' http://localhost:8080/api/v1/alumnos/999)" = "404"
          test "$(curl -s -o /tmp/m2-info.json -w '%{http_code}' http://localhost:8080/api/v1/alumnos/info-peticion -H 'User-Agent: MiCliente/1.0' -H 'Accept-Language: es-ES')" = "200"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/m2-info.json', encoding='utf-8'))
          assert data=={'userAgent':'MiCliente/1.0','idioma':'es-ES'}, data
          PY

          echo '=== filtro, sort y paginación ahora delegados en AlumnoService ==='
          curl -fsS 'http://localhost:8080/api/v1/alumnos?page=0&size=1' > /tmp/m2-page0.json
          curl -fsS 'http://localhost:8080/api/v1/alumnos?page=1&size=1' > /tmp/m2-page1.json
          curl -fsS 'http://localhost:8080/api/v1/alumnos?sort=nombre&page=0&size=20' > /tmp/m2-sort.json
          curl -fsS --get http://localhost:8080/api/v1/alumnos --data-urlencode 'curso=5º Primaria' --data-urlencode 'sort=nombre' --data-urlencode 'page=0' --data-urlencode 'size=10' > /tmp/m2-filter.json
          python - <<'PY'
          import json
          p0=json.load(open('/tmp/m2-page0.json', encoding='utf-8'))
          p1=json.load(open('/tmp/m2-page1.json', encoding='utf-8'))
          so=json.load(open('/tmp/m2-sort.json', encoding='utf-8'))
          fi=json.load(open('/tmp/m2-filter.json', encoding='utf-8'))
          assert [x['id'] for x in p0]==['1'], p0
          assert [x['id'] for x in p1]==['2'], p1
          assert [x['nombre'] for x in so]==['Ana','Luis'], so
          assert [x['id'] for x in fi]==['1'], fi
          PY

          echo '=== regla de negocio: DNI duplicado -> 409 sin mutación ==='
          test "$(curl -s -o /tmp/m2-duplicate.json -w '%{http_code}' -X POST http://localhost:8080/api/v1/alumnos -H 'Content-Type: application/json' -d '{"nombre":"Otra Ana","apellidos":"Duplicada","dni":"DNI-DEMO-01","fechaNacimiento":"2010-01-01","curso":"5º Primaria"}')" = "409"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/m2-duplicate.json', encoding='utf-8'))
          assert data['status']==409, data
          assert data['error']=='Conflict', data
          assert data['message']=='Ya existe un alumno con el DNI DNI-DEMO-01', data
          PY
          curl -fsS http://localhost:8080/api/v1/alumnos > /tmp/m2-after-duplicate.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/m2-after-duplicate.json', encoding='utf-8'))
          assert len(data)==2, data
          assert [x['id'] for x in data]==['1','2'], data
          PY

          echo '=== creación válida + Location y persistencia ==='
          curl -sS -D /tmp/m2-post.headers -o /tmp/m2-post.json -X POST http://localhost:8080/api/v1/alumnos -H 'Content-Type: application/json' -d '{"nombre":"Carlos","apellidos":"Zeta","dni":"DNI-DEMO-03","fechaNacimiento":"2011-01-02","curso":"5º Primaria"}'
          tr -d '\r' < /tmp/m2-post.headers > /tmp/m2-post.headers.normalized
          grep -Eq '^HTTP/[^ ]+ 201' /tmp/m2-post.headers.normalized
          grep -Eiq '^Location: /api/v1/alumnos/3$' /tmp/m2-post.headers.normalized
          python - <<'PY'
          import json
          data=json.load(open('/tmp/m2-post.json', encoding='utf-8'))
          assert data['id']=='3' and data['nombre']=='Carlos', data
          PY
          test "$(curl -s -o /tmp/m2-get3.json -w '%{http_code}' http://localhost:8080/api/v1/alumnos/3)" = "200"

          echo '=== PUT/PATCH/links delegados ==='
          test "$(curl -s -o /tmp/m2-put.json -w '%{http_code}' -X PUT http://localhost:8080/api/v1/alumnos/3 -H 'Content-Type: application/json' -d '{"id":"999","nombre":"Aaron","apellidos":"Abarca","dni":"DNI-DEMO-03","fechaNacimiento":"2011-01-02","curso":"5º Primaria"}')" = "200"
          test "$(curl -s -o /tmp/m2-put404.json -w '%{http_code}' -X PUT http://localhost:8080/api/v1/alumnos/999 -H 'Content-Type: application/json' -d '{"nombre":"X","apellidos":"Y","dni":"Z","fechaNacimiento":"2010-01-01","curso":"1º"}')" = "404"
          test "$(curl -s -o /tmp/m2-patch.json -w '%{http_code}' -X PATCH http://localhost:8080/api/v1/alumnos/3 -H 'Content-Type: application/json' -d '{"curso":"6º Primaria B"}')" = "200"
          test "$(curl -s -o /tmp/m2-patch404.json -w '%{http_code}' -X PATCH http://localhost:8080/api/v1/alumnos/999 -H 'Content-Type: application/json' -d '{"curso":"X"}')" = "404"
          test "$(curl -s -o /tmp/m2-links.json -w '%{http_code}' http://localhost:8080/api/v1/alumnos/1/con-enlaces)" = "200"
          test "$(curl -s -o /tmp/m2-links404.json -w '%{http_code}' http://localhost:8080/api/v1/alumnos/999/con-enlaces)" = "404"
          python - <<'PY'
          import json
          put=json.load(open('/tmp/m2-put.json', encoding='utf-8'))
          patch=json.load(open('/tmp/m2-patch.json', encoding='utf-8'))
          links=json.load(open('/tmp/m2-links.json', encoding='utf-8'))
          assert put['id']=='3' and put['nombre']=='Aaron', put
          assert patch['id']=='3' and patch['curso']=='6º Primaria B', patch
          assert links['alumno']['id']=='1', links
          assert links['_links']['self']=='/api/v1/alumnos/1', links
          PY

          echo '=== errores 400 y 415 siguen siendo frontera HTTP ==='
          test "$(curl -s -o /tmp/m2-bad-json.json -w '%{http_code}' -X POST http://localhost:8080/api/v1/alumnos -H 'Content-Type: application/json' -d '{"nombre":"Pedro", "apellidos":"Sánchez",}')" = "400"
          test "$(curl -s -o /tmp/m2-media.txt -w '%{http_code}' -X POST http://localhost:8080/api/v1/alumnos -H 'Content-Type: text/plain' --data 'hola')" = "415"

          echo '=== DELETE y promoción delegados ==='
          test "$(curl -s -o /tmp/m2-delete.txt -w '%{http_code}' -X DELETE http://localhost:8080/api/v1/alumnos/3)" = "204"
          test "$(curl -s -o /tmp/m2-delete404.txt -w '%{http_code}' -X DELETE http://localhost:8080/api/v1/alumnos/3)" = "404"
          test "$(curl -s -o /tmp/m2-promote.txt -w '%{http_code}' -X POST http://localhost:8080/api/v1/alumnos/promocionar)" = "204"
          test ! -s /tmp/m2-promote.txt
          curl -fsS http://localhost:8080/api/v1/alumnos > /tmp/m2-promoted.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/m2-promoted.json', encoding='utf-8'))
          assert len(data)==2, data
          assert all(x['curso'].endswith(' (promocionado)') for x in data), data
          PY

          echo '=== reto ExpedienteService: CRUD básico + contratos heredados ==='
          test "$(curl -s -o /tmp/m2-exp-list.json -w '%{http_code}' http://localhost:8080/api/v1/expedientes)" = "200"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/m2-exp-list.json', encoding='utf-8'))
          assert len(data)==2, data
          assert [x['id'] for x in data]==['1','2'], data
          PY
          test "$(curl -s -o /tmp/m2-exp-get1.json -w '%{http_code}' http://localhost:8080/api/v1/expedientes/1)" = "200"
          test "$(curl -s -o /tmp/m2-exp-get999.json -w '%{http_code}' http://localhost:8080/api/v1/expedientes/999)" = "404"
          curl -sS -D /tmp/m2-exp-post.headers -o /tmp/m2-exp-post.json -X POST http://localhost:8080/api/v1/expedientes -H 'Content-Type: application/json' -d '{"titular":"Marta Ruiz","dni":"11111111H","estado":"EN_TRAMITE","tipo":"BECA","fechaSolicitud":"2025-02-01","importe":800.0,"activo":true}'
          tr -d '\r' < /tmp/m2-exp-post.headers > /tmp/m2-exp-post.headers.normalized
          grep -Eq '^HTTP/[^ ]+ 201' /tmp/m2-exp-post.headers.normalized
          grep -Eiq '^Location: /api/v1/expedientes/3$' /tmp/m2-exp-post.headers.normalized
          python - <<'PY'
          import json
          data=json.load(open('/tmp/m2-exp-post.json', encoding='utf-8'))
          assert data['id']=='3', data
          assert data['titular']=='Marta Ruiz', data
          PY
          test "$(curl -s -o /tmp/m2-exp-get3.json -w '%{http_code}' http://localhost:8080/api/v1/expedientes/3)" = "200"
          test "$(curl -s -o /tmp/m2-exp-put3.json -w '%{http_code}' -X PUT http://localhost:8080/api/v1/expedientes/3 -H 'Content-Type: application/json' -d '{"id":"999","titular":"Marta Actualizada","dni":"11111111H","estado":"RESUELTA","tipo":"BECA","fechaSolicitud":"2025-02-01","importe":850.0,"activo":true}')" = "200"
          test "$(curl -s -o /tmp/m2-exp-put999.json -w '%{http_code}' -X PUT http://localhost:8080/api/v1/expedientes/999 -H 'Content-Type: application/json' -d '{"titular":"X"}')" = "404"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/m2-exp-put3.json', encoding='utf-8'))
          assert data['id']=='3', data
          assert data['titular']=='Marta Actualizada', data
          PY
          test "$(curl -s -o /tmp/m2-exp-delete3.txt -w '%{http_code}' -X DELETE http://localhost:8080/api/v1/expedientes/3)" = "204"
          test "$(curl -s -o /tmp/m2-exp-delete3-again.txt -w '%{http_code}' -X DELETE http://localhost:8080/api/v1/expedientes/3)" = "404"
          test "$(curl -s -o /tmp/m2-exp-get3-final.json -w '%{http_code}' http://localhost:8080/api/v1/expedientes/3)" = "404"

          grep -q 'Started MiProyectoApplication' /tmp/m2-22.log
