<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Prueba CORS M5</title>
</head>
<body>
  <h1>Prueba de CORS</h1>
  <button onclick="consultarAlumnos()">Consultar alumnos</button>
  <button onclick="crearAlumno()">Crear alumno</button>
  <pre id="resultado"></pre>
  <script>
    const baseUrl = 'http://localhost:8080/api/v1/alumnos';
    const resultado = document.getElementById('resultado');

    async function consultarAlumnos() {
      try {
        const response = await fetch(baseUrl);
        resultado.textContent = JSON.stringify(await response.json(), null, 2);
      } catch (error) {
        resultado.textContent = 'Error: ' + error.message;
      }
    }

    async function crearAlumno() {
      try {
        const response = await fetch(baseUrl, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            nombre: 'Ana',
            apellidos: 'García',
            dni: '99999999Z',
            fechaNacimiento: '2010-05-12',
            curso: '5º Primaria'
          })
        });
        resultado.textContent = JSON.stringify(await response.json(), null, 2);
      } catch (error) {
        resultado.textContent = 'Error: ' + error.message;
      }
    }
  </script>
</body>
</html>
